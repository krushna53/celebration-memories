<svg width="320" height="230" viewBox="0 0 320 230" xmlns="http://www.w3.org/2000/svg">
  <title>EveryMoment stacked logo lockup with tagline</title>
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#FF6B57"/>
    </linearGradient>
  </defs>
  <g transform="translate(100,10)">
    <circle cx="60" cy="60" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="11" stroke-linecap="round" stroke-dasharray="207 57" transform="rotate(-98 60 60)"/>
    <circle cx="102" cy="60" r="11" fill="#FF6B57"/>
  </g>
  <text x="160" y="165" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="400" fill="#4F46E5">every<tspan font-weight="600" fill="#FF6B57">moment</tspan></text>
  <text x="160" y="195" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" letter-spacing="2">EVERY MOMENT MATTERS.</text>
</svg>
